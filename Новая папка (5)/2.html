<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Responsive Registration Form</title>
		<link rel="stylesheet" href="2.css">
	</head>
    <div class="form-container">
        <h1>Responsive Registration Form</h1>
    <form action="#">
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>
            <input type="password" placeholder="Re-type Password" required>

            <div class="name-fields">
                <input type="text" placeholder="First Name" required>
                <input type="text" placeholder="Last Name" required>
            </div>

            <div class="gender-fields">
                <input type="radio" id="male" name="gender" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" required>
                <label for="female">Female</label>
            </div>

            <select required>
                <option value="" disabled selected>Select a country</option>
                <option value="usa">USA</option>
                <option value="canada">Canada</option>
                <option value="uk">UK</option>
                <option value="australia">Australia</option>
            </select>

            <div class="checkbox-fields">
                <input type="checkbox" id="terms" required>
                <label for="terms">I agree with terms and conditions</label>
            </div>

            <div class="checkbox-fields">
                <input type="checkbox" id="newsletter">
                <label for="newsletter">I want to receive the newsletter</label>
            </div>

            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
