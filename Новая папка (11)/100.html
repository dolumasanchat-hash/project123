<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <title></title>
        <script src="D:\jQuery\jquery-4.0.0.min.js">
        </script>
    </head>
    <body>
  <ul id="myList">
  <li>Пункт 1</li>
  <li>Пункт 2</li>
  <li>Пункт 3</li>
</ul>
<button id="addButton">Добавить пункт</button>
<script>
    // Получаем элементы
 const ul = document.GetElementById('myList');
 const addButton = document.GetElementById('addButton');
 // Обработчик для ul (делегирование)
 ul.AddEventListener('click', function(event) {
 // Проверяем, на каком элементе произошло событие
 if (event.Target.TagName === 'LI') {
 // Если кликнули на li — добавляем '!' в конец текста
 event.Target.TextContent += '!';
}
});
 // Обработчик кнопки
 addButton.AddEventListener('click', function() {
 // Создаём новый li
 const newLi = document.CreateElement('li');
 newLi.TextContent = 'пункт';
 // Добавляем в конец ul
 ul.AppendChild(newLi);
});
</script>
    </body>
</html>
